        <script>
        (function() {
          function killBadge() {
            // Match by id
            var el = document.getElementById('emergent-badge');
            if (el && el.parentNode) el.parentNode.removeChild(el);
            // Also match by text content as a fallback
            document.querySelectorAll('a[href*=\"emergent.sh\"]').forEach(function(a){
              if (a.textContent && a.textContent.indexOf('Made with Emergent') !== -1) {
                a.parentNode && a.parentNode.removeChild(a);
              }
            });
          }
          killBadge();
          if (typeof MutationObserver !== 'undefined') {
            var obs = new MutationObserver(killBadge);
            obs.observe(document.documentElement, { childList: true, subtree: true });
          } else {
            setInterval(killBadge, 500);
          }
        })();
        </script>
